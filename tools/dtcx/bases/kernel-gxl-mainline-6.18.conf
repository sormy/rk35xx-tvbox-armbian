# Mainline 6.18, the kernel the GXL boxes run; its dt-bindings are ABI, so every later release
# numbers them the same
source torvalds/linux v6.18 (7d0a66e4bb9081d75c82ec4957c50034cb0ea449), include/
url https://raw.githubusercontent.com/torvalds/linux/7d0a66e4bb9081d75c82ec4957c50034cb0ea449/include
header dt-bindings/clock/gxbb-clkc.h
header dt-bindings/clock/gxbb-aoclkc.h
header dt-bindings/reset/amlogic,meson-gxbb-reset.h
header dt-bindings/reset/gxbb-aoclkc.h
header dt-bindings/gpio/gpio.h
header dt-bindings/interrupt-controller/arm-gic.h
header dt-bindings/interrupt-controller/irq.h
header dt-bindings/input/linux-event-codes.h
header dt-bindings/thermal/thermal.h
render cells gpio-flags gic input-codes thermal opp-hz
cells clock-controller@0 clocks,assigned-clocks,assigned-clock-parents dt-bindings/clock/gxbb-clkc.h CLKID_
cells clock-controller clocks,assigned-clocks,assigned-clock-parents dt-bindings/clock/gxbb-aoclkc.h CLKID_AO_
cells reset-controller@4404 resets dt-bindings/reset/amlogic,meson-gxbb-reset.h RESET_
cells clock-controller resets dt-bindings/reset/gxbb-aoclkc.h RESET_AO_
rules kernel-gxl-vendor-4.9
