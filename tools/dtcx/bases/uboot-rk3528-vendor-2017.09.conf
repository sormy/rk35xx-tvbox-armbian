# Rockchip's vendor U-Boot, which built the RK3528 boxes' factory U-Boot trees
source rockchip-linux/u-boot 4c7992e58d3f7cb50b09a9bf1a7ad334f01d46ad, include/
url https://raw.githubusercontent.com/rockchip-linux/u-boot/4c7992e58d3f7cb50b09a9bf1a7ad334f01d46ad/include
header dt-bindings/clock/rk3528-cru.h
header dt-bindings/gpio/gpio.h
header dt-bindings/interrupt-controller/arm-gic.h
header dt-bindings/interrupt-controller/irq.h
header dt-bindings/pinctrl/rockchip.h
header dt-bindings/input/linux-event-codes.h
header dt-bindings/thermal/thermal.h
render cells gpio-flags gic rockchip-pins input-codes thermal opp-hz
cells clock-controller@ff4a0000 clocks,assigned-clocks,assigned-clock-parents CLK SCLK_ PCLK_ HCLK_ ACLK_ CCLK_ BCLK_ TCLK_ DBCLK_ MCLK_ DCLK_ XIN_
cells clock-controller@ff4a0000 resets SRST_
# SCMI_ names address the firmware's clock provider, never a CRU cell
cells protocol@14 clocks,assigned-clocks,assigned-clock-parents SCMI_
