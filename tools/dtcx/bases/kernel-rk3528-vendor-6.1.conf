# Rockchip's 6.1 vendor kernel, which built the RK3528 boxes' factory kernel trees and is the kernel
# they run
source rockchip-linux/kernel develop-6.1 (77168c8d5ab82399f65a80e9f807b50ba37cf483), include/
url https://raw.githubusercontent.com/rockchip-linux/kernel/77168c8d5ab82399f65a80e9f807b50ba37cf483/include
header dt-bindings/clock/rk3528-cru.h
header dt-bindings/power/rk3528-power.h
header dt-bindings/gpio/gpio.h
header dt-bindings/interrupt-controller/arm-gic.h
header dt-bindings/interrupt-controller/irq.h
header dt-bindings/pinctrl/rockchip.h
header dt-bindings/input/linux-event-codes.h
header dt-bindings/thermal/thermal.h
render cells gpio-flags gic rockchip-pins input-codes thermal opp-hz
cells clock-controller@ff4a0000 clocks,assigned-clocks,assigned-clock-parents CLK SCLK_ PCLK_ HCLK_ ACLK_ CCLK_ BCLK_ TCLK_ DBCLK_ MCLK_ DCLK_ XIN_
cells clock-controller@ff4a0000 resets SRST_
cells protocol@14 clocks,assigned-clocks,assigned-clock-parents SCMI_
cells power-controller power-domains RK3528_PD_
# Rockchip's own quantities
decimal rockchip,low-temp rockchip,high-temp rockchip,temp-hysteresis rockchip,low-temp-min-volt
decimal rockchip,high-temp-max-volt rockchip,pvtm-volt rockchip,pvtm-ref-temp rockchip,pvtm-sample-time
decimal rockchip,normal-rates rockchip,video-4k-freq rockchip,video-1080p-freq mbist-vmin
decimal rockchip,hw-tshut-temp rockchip,polling-delay rockchip,offline-cpu-temp
decimal rockchip,taskqueue-node rockchip,resetgroup-node rockchip,taskqueue-count rockchip,task-capacity
decimal upthreshold downdifferential static-coefficient
decimal rockchip,pvtm-freq auto-min-freq rockchip,resetgroup-count rockchip,bit-shift system-status-level
decimal rockchip,pvtm-voltage-sel rockchip,leakage-voltage-sel leakage-range
decimal rockchip,baudrate rockchip,mclk-fs rockchip,default-sample-phase rockchip,rcb-min-width
decimal dynamic-coefficient boot-log-count
# Rockchip's own gpio properties, which dtc cannot know hold a reference
gpio WIFI,host_wake_irq BT,wake_host_irq gpio_host_wake gpio_chip_wake gpio_chip_en
