# Amlogic's 4.9 vendor kernel, which built the GXL boxes' factory trees, as Khadas carries it: its
# GXL clock numbering decodes every factory clock cell to the name its clock-names gives
source khadas/linux khadas-vims-4.9.y (bd9460728746cc080acbaa084e53460437f43211), include/
url https://raw.githubusercontent.com/khadas/linux/bd9460728746cc080acbaa084e53460437f43211/include
header dt-bindings/clock/amlogic,gxl-clkc.h
header dt-bindings/gpio/gpio.h
header dt-bindings/interrupt-controller/arm-gic.h
header dt-bindings/interrupt-controller/irq.h
header dt-bindings/input/linux-event-codes.h
header dt-bindings/thermal/thermal.h
render cells gpio-flags gic input-codes thermal opp-hz
cells clock-controller@0 clocks,assigned-clocks,assigned-clock-parents CLKID_
# Amlogic's own quantities
decimal clk*_cfg:clk_freq clk*_cfg:clkp_freq clk*_cfg:voltage clk*_cfg:keep_count clk*_cfg:threshold
decimal release_delay dynamic-coefficient
decimal fifosize min_state dyn_coeff cluster_id
decimal f_min f_max spifc-frequency suspend_timeout shutdown_timeout default_timeout firmware_timeout
decimal chip_num key_num keynum mapnum plat-num part_num port_num unifykey-num num_of_pp
decimal times scan_period control_interval max_frame_time cec_version clockevent-rating
decimal clockevent-shift duty-cycle bit_resolution
# Amlogic's own gpio properties, which dtc cannot know hold a reference
gpio gpio_en gpio_reset gpio_dat3 gpio_cd interrupt_pin power_on_pin hw_reset jtag_pin
decimal parts
# Amlogic's own properties holding bare references
ref cpu_list codec_list plat_list key key[0-9]* map map[0-9]* part-[0-9]* plat-part-[0-9]*
ref partition spinor_partition vend-data
