# rk35xx: the kernel every Rockchip board runs. Read by the build; paths are relative to the repo.
REPO=https://github.com/rockchip-linux/kernel.git
# Rockchip's 6.1 series, its tip at each build
BRANCH=develop-6.1
# the base config as a savedefconfig, then the fragment on top
CONFIG=kernel/rk35xx.defconfig
FRAGMENT=kernel/rk35xx.fragment

# "<directory in the kernel tree>:<patch file>", applied in order; DKMS-only patches are left out
PATCHES="
  .:patches/linux-rockchip/input-remotectl-share-pwm-irq.patch
  .:patches/linux-rockchip/net-stmmac-skip-absent-mdio-reset-gpio.patch
  .:patches/linux-rockchip/bluetooth-hci-h4-serdev.patch
  .:patches/linux-rockchip/bluetooth-hci-h4-aic8800-bdaddr.patch
"
