# The RK3528 boards' U-Boot: mainline, each with its own control tree, boards/<board>/uboot.dts.
REPO=https://github.com/u-boot/u-boot.git
TAG=v2026.10
DEFCONFIG=generic-rk3528_defconfig
SOC=rk3528
# the recovery button is read through the SARADC, which the generic defconfig leaves off
CONFIGS="ADC=y SARADC_ROCKCHIP=y"
PATCHES=patches/u-boot/0003-rockchip-take-the-mac-address-from-vendor-storage.patch
# binman assembles a FIT around the ATF; it also needs a TPL, which the FIT does not carry
RKBIN=https://github.com/rockchip-linux/rkbin.git
RKBIN_COMMIT=ecb4fcbe954edf38b3ae037d5de6d9f5bccf81f4
BL31=bin/rk35/rk3528_bl31_v1.21.elf
TPL=bin/rk35/rk3528_ddr_1056MHz_v1.13.bin
