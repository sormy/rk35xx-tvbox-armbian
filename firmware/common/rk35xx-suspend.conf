# Enable suspend-to-RAM (deep mem). Armbian disables the suspend verb by default (most SBCs
# can't), but these boxes suspend, resume (RAM intact, WiFi survives), and IR-wake correctly. This
# only makes the verb *available* — the power key uses it only when HandlePowerKey=suspend
# (see the logind drop-in). Staged to /etc/systemd/sleep.conf.d/.
[Sleep]
AllowSuspend=yes
SuspendState=mem
