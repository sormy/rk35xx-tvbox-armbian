# Arm the SoC watchdog (snps,dw-wdt @ ffac0000, enabled in board.dtb). systemd pings it from PID 1
# and the hardware resets the box if it stops — the recovery path for a hard hang on a headless box.
# The hardware timeout is fixed at 44 s and cannot be changed, so keep this comfortably below it.
# To disable: set RuntimeWatchdogSec=off here, then systemctl daemon-reexec.
# Staged to /etc/systemd/system.conf.d/.
[Manager]
RuntimeWatchdogSec=30
