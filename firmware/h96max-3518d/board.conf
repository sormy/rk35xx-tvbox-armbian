# H96 Max 3518D board definition, sourced by build-image.sh. Paths are relative to firmware/.
BOARD_BASE=rock-2f
BOARD_HOSTNAME=h96max-3518d
BOARD_DTB=h96max-3518d/board.dtb
BOARD_IDBLOADER=h96max-3518d/factory_idbloader.bin
BOARD_UBOOT=h96max-3518d/uboot.itb
BOARD_PAYLOAD=h96max-3518d/payload.list
# keeps the vendor fiq-debugger on uart0, so the console is ttyFIQ0 as on stock; its baud comes
# from the node's rockchip,baudrate. earlycon is still the plain 8250 at the same address.
BOARD_SERIALCON="earlycon=uart8250,mmio32,0xff9f0000 console=ttyFIQ0"
BOARD_WANTS="rk35xx-firstboot.service rk35xx-mac-pin.service"

# on-box naming for rk35xx-update
BOARD_PREFIX=rk35xx
BOARD_UPDATE_RESTART="rk35xx-mac-pin.service"
# DKMS sources rk35xx-update refetches in place, "<pkg>-<ver>:<fetch script>"
BOARD_DKMS_FETCH="seekwave-swt6621s-1.0.0:common/fetch-seekwave-src.sh"

# No IR receiver is fitted, so pwm@ffa90030 is disabled in board.dts and neither the built-in
# remotectl driver nor our patched one has anything to bind. Both the DKMS module and the
# initcall blacklist that exists to suppress the built-in one are therefore dead weight here.
BOARD_IR_BLACKLIST=""


board_stage_dkms() {
  # the Seekwave Wi-Fi/BT stack: whole pinned source tree staged for the offline dkms build
  "$FW/common/fetch-seekwave-src.sh" "$2/seekwave"
  (cd "$2/seekwave" && find . -type f | sed 's|^\./||') | while read -r f; do
    e2mkdir "$1:/usr/src/seekwave-swt6621s-1.0.0/$(dirname "$f")" 2>/dev/null || true
    e2cp "$2/seekwave/$f" "$1:/usr/src/seekwave-swt6621s-1.0.0/$f"
  done
}

board_image_tweaks() {
  :  # nothing board-specific beyond the payload — the factory DTB carries the board truths
}
