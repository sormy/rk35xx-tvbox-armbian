# R69 board definition, sourced by build-image.sh. Paths are relative to firmware/.
BOARD_HOSTNAME=r69
BOARD_NAME_LABEL="R69"
BOARD_DTB=r69/board.dtb
BOARD_IDBLOADER=r69/factory_idbloader.bin
BOARD_PAYLOAD=r69/payload.list
BOARD_WANTS="r69-firstboot.service r69-mac-pin.service r69-bt.service"

# on-box naming + services for rk35xx-update. The R69 predates the neutral rk35xx- scheme and keeps
# its historical names on disk; BOARD_PREFIX drives every installed path the updater touches.
BOARD_PREFIX=r69
BOARD_UPDATE_RESTART="r69-mac-pin.service"
BOARD_UPDATE_TRY_RESTART="r69-bt.service"   # try-, so a disabled hciattach is never resurrected

# DKMS driver sources fetched on the build host, staged into the image for offline first-boot
# builds ($1 = FS node for e2cp, $2 = scratch dir)
board_stage_dkms() {
  "$FW/common/fetch-dkms-src.sh" "$2/ir" "$2/phy"
  # legacy r69 DKMS names, generated on the fly from the neutral sources (deployed-box contract)
  sed -i.bak 's/remotectl-pwm-rk35xx/remotectl-pwm-r69/' "$2/ir/rockchip_pwm_remotectl.c"
  sed 's/rk35xx/r69/g' "$FW/common/ir/Makefile"      > "$2/ir-Makefile.r69"
  sed 's/rk35xx/r69/g' "$FW/common/ir/dkms.conf"     > "$2/ir-dkms.conf.r69"
  sed 's/rk35xx/r69/g' "$FW/common/ethphy/dkms.conf" > "$2/ethphy-dkms.conf.r69"
  e2mkdir "$1:/usr/src/rockchip-pwm-remotectl-r69-1.0" 2>/dev/null || true
  e2mkdir "$1:/usr/src/rk630-phy-r69-1.0" 2>/dev/null || true
  e2cp "$2/ir/rockchip_pwm_remotectl.c" "$1:/usr/src/rockchip-pwm-remotectl-r69-1.0/rockchip_pwm_remotectl.c"
  e2cp "$2/ir/rockchip_pwm_remotectl.h" "$1:/usr/src/rockchip-pwm-remotectl-r69-1.0/rockchip_pwm_remotectl.h"
  e2cp -P 0644 "$2/ir-Makefile.r69"  "$1:/usr/src/rockchip-pwm-remotectl-r69-1.0/Makefile"
  e2cp -P 0644 "$2/ir-dkms.conf.r69" "$1:/usr/src/rockchip-pwm-remotectl-r69-1.0/dkms.conf"
  e2cp "$2/phy/rk630phy.c"        "$1:/usr/src/rk630-phy-r69-1.0/rk630phy.c"
  e2cp -P 0644 "$2/ethphy-dkms.conf.r69" "$1:/usr/src/rk630-phy-r69-1.0/dkms.conf"
  printf 'obj-m += rk630phy.o\n' > "$2/ethphy-Makefile"
  e2cp -P 0644 "$2/ethphy-Makefile" "$1:/usr/src/rk630-phy-r69-1.0/Makefile"
}

# board-specific image drop-ins that aren't verbatim payload files ($1 = FS, $2 = scratch)
board_image_tweaks() {
  # blacklist the aic8800 USB driver; r69-firstboot removes the conflicting DKMS package and only
  # then enables the early aic8800_fdrv load (see the original build-image.sh notes)
  printf 'blacklist aic8800_fdrv_usb\n' > "$2/blacklist-aic8800-usb.conf"
  e2cp "$2/blacklist-aic8800-usb.conf" "$1:/etc/modprobe.d/blacklist-aic8800-usb.conf"
}
