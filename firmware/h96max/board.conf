# H96 Max board definition, sourced by build-image.sh. Paths are relative to firmware/.
BOARD_HOSTNAME=h96max
BOARD_DTB=h96max/board.dtb
BOARD_IDBLOADER=h96max/factory_idbloader.bin
BOARD_PAYLOAD=h96max/payload.list
BOARD_WANTS="rk35xx-firstboot.service rk35xx-mac-pin.service"

# on-box naming for rk35xx-update
BOARD_PREFIX=rk35xx
BOARD_UPDATE_RESTART="rk35xx-mac-pin.service"

board_stage_dkms() {
  "$FW/common/fetch-dkms-src.sh" "$2/ir"
  e2cp "$2/ir/rockchip_pwm_remotectl.c" "$1:/usr/src/rockchip-pwm-remotectl-rk35xx-1.0/rockchip_pwm_remotectl.c"
  e2cp "$2/ir/rockchip_pwm_remotectl.h" "$1:/usr/src/rockchip-pwm-remotectl-rk35xx-1.0/rockchip_pwm_remotectl.h"
  # the Seekwave Wi-Fi/BT stack: whole pinned source tree staged for the offline dkms build
  "$FW/h96max/fetch-seekwave-src.sh" "$2/seekwave"
  (cd "$2/seekwave" && find . -type f | sed 's|^\./||') | while read -r f; do
    e2mkdir "$1:/usr/src/seekwave-swt6621s-1.0.0/$(dirname "$f")" 2>/dev/null || true
    e2cp "$2/seekwave/$f" "$1:/usr/src/seekwave-swt6621s-1.0.0/$f"
  done
}

board_image_tweaks() {
  :  # nothing board-specific beyond the payload — the factory DTB carries the board truths
}
