# H96 Max M20 board definition, sourced by build-image.sh. Paths are relative to firmware/.
# Amlogic, not Rockchip: the factory eMMC bootloader stays, and the image follows the eMMC's own
# layout, so it boots from a stick or, written by scripts/aml-emmc-install, from the eMMC.
BOARD_FAMILY=meson-gxl
BOARD_BASE=lepotato
BOARD_HOSTNAME=h96max-m20
BOARD_DTB=h96max-m20/board.dtb
BOARD_FDT=amlogic/board.dtb
BOARD_PAYLOAD=h96max-m20/payload.list
BOARD_WANTS="rk35xx-firstboot.service"

# U-Boot 2015 in eMMC computes a kernel's load address as 0 and aborts, so it chain-loads the base
# image's own U-Boot first. This is where that build sits in the rootfs.
BOARD_UBOOT_SRC=/usr/lib/linux-u-boot-current-lepotato/u-boot-dtb.img

# Single boot, as CoreELEC installs: the factory partition table and device trees in stock/<board>/
# are rewritten with cache gone, so env moves down and the rootfs takes the rest of the eMMC.
BOARD_AML_MMC_DEV=1           # the eMMC, as amlmmc numbers it
BOARD_AML_EMMC_SECTORS=30777344

BOARD_SERIALCON="console=ttyAML0,115200n8 earlycon"
BOARD_IR_BLACKLIST=""         # no Rockchip PWM receiver to suppress
BOARD_CMA=""                  # nothing reaches the video engines yet

# on-box naming for rk35xx-update
BOARD_PREFIX=rk35xx
# DKMS sources rk35xx-update refetches in place, "<pkg>-<ver>:<fetch script>"
# The Wi-Fi half is mainline mt76 plus one device id; the vendor driver tree is not shipped.
BOARD_DKMS_FETCH="mt76-mt7668-1.0.0:common/fetch-mt76-src.sh"
# The Lepotato base ships no toolchain and this box has no network on first boot, so the build
# stages the closure of these into /var/cache/apt/archives for rk35xx-firstboot to install.
BOARD_APT_DEBS="dkms linux-headers-current-meson64 firmware-mediatek"

board_stage_dkms() {
  # mainline mt76, patched to claim the MT7668S, staged for the offline dkms build
  "$FW/common/fetch-mt76-src.sh" "$2/mt76" "${KVER%%-*}"
  (cd "$2/mt76" && find . -type f | sed 's|^\./||') | while read -r src; do
    e2mkdir "$1:/usr/src/mt76-mt7668-1.0.0/$(dirname "$src")" 2>/dev/null || true
    e2cp "$2/mt76/$src" "$1:/usr/src/mt76-mt7668-1.0.0/$src"
  done
}

board_image_tweaks() {
  :  # nothing board-specific beyond the payload
}
