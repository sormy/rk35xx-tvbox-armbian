# Mortal T1 (XR8223518K-V1.0) board definition, sourced by build-image.sh. Paths are relative to firmware/.
BOARD_BASE=rock-2f
BOARD_HOSTNAME=mortal-t1
BOARD_DTB=mortal-t1/board.dtb
BOARD_IDBLOADER=mortal-t1/factory_idbloader.bin
BOARD_UBOOT=mortal-t1/uboot.itb
BOARD_PAYLOAD=mortal-t1/payload.list
BOARD_WANTS="rk35xx-firstboot.service rk35xx-mac-pin.service rk35xx-bt.service"

# on-box naming for rk35xx-update
BOARD_PREFIX=rk35xx
BOARD_UPDATE_RESTART="rk35xx-mac-pin.service"
BOARD_UPDATE_TRY_RESTART="rk35xx-bt.service"   # try-, so a disabled hciattach is never resurrected

board_stage_dkms() {
  "$FW/common/fetch-dkms-src.sh" "$2/ir"
  e2cp "$2/ir/rockchip_pwm_remotectl.c" "$1:/usr/src/rockchip-pwm-remotectl-rk35xx-1.0/rockchip_pwm_remotectl.c"
  e2cp "$2/ir/rockchip_pwm_remotectl.h" "$1:/usr/src/rockchip-pwm-remotectl-rk35xx-1.0/rockchip_pwm_remotectl.h"
}

# board-specific image drop-ins that aren't verbatim payload files ($1 = FS, $2 = scratch)
board_image_tweaks() {
  # blacklist the aic8800 USB driver; rk35xx-firstboot-board removes the conflicting DKMS package
  # and only then enables the early aic8800_fdrv load
  printf 'blacklist aic8800_fdrv_usb\n' > "$2/blacklist-aic8800-usb.conf"
  e2cp "$2/blacklist-aic8800-usb.conf" "$1:/etc/modprobe.d/blacklist-aic8800-usb.conf"
}
