# the AIC8800 SDIO: platform, Wi-Fi and Bluetooth low-power drivers, as Armbian's rkr5.1 carried them
# (6.1-era cfg80211 calls: not on 6.12, where radxa-pkg/aic8800 is the source to take)
REPO=https://github.com/armbian/linux-rockchip.git
COMMIT=372ce582b94a3360a29727c3c49c88bb7509da22
KERNELS=rk35xx
SUBDIRS=drivers/net/wireless/aic8800_sdio
PATCHES="
  .:patches/linux-rockchip/wireless-aic8800-stable-mac.patch
"
# its in-tree Kconfig set these, and the firmware path the driver reads with no request_firmware()
MAKE_ARGS="CONFIG_AIC_WLAN_SUPPORT=m CONFIG_AIC8800_WLAN_SUPPORT=m CONFIG_AIC8800_BTLPM_SUPPORT=m CONFIG_AIC_FW_PATH=/lib/firmware/aic8800/SDIO/aic8800D80/"
